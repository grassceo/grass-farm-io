<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Grass Farm</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1626;--pn:#2a2038;--ln:#43335a;--tx:#f1e9ff;--dim:#9f90bb;--ok:#7be04e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:var(--bg);color:var(--tx);font:10px/1.7 'Press Start 2P',monospace;padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 16px);max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
h1{font-size:11px;margin:0;color:var(--ok)}
.dim{color:var(--dim)}
.bal{text-align:right;color:var(--ok);font-size:13px}
.bal small{display:block;color:var(--dim);font-size:8px}
canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;border:3px solid var(--ln);background:#000}
#hint{background:var(--pn);border:3px solid var(--ln);border-top:0;padding:8px;min-height:50px;font-size:9px}
#ctl{display:flex;gap:8px;margin-top:10px}
#ctl button{height:64px;border:3px solid var(--ln);background:#3a2c52;color:var(--tx);font:inherit;font-size:16px;touch-action:none;cursor:pointer}
#L,#R{width:72px}
#A{flex:1;font-size:9px;line-height:1.5;padding:4px}
#A.on{background:#3d7a25;border-color:var(--ok)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:4px solid var(--ok);padding:12px 10px calc(env(safe-area-inset-bottom) + 14px);display:none;max-height:80%;overflow:auto;z-index:4}
#sheet h2{font-size:11px;margin:0 0 6px;color:var(--ok)}
.b{display:flex;justify-content:space-between;gap:8px;width:100%;background:#3a2c52;color:var(--tx);border:3px solid var(--ln);font:inherit;font-size:9px;padding:9px;margin-top:6px;text-align:left;cursor:pointer}
.b:disabled{opacity:.45;cursor:default}
.b em{font-style:normal;color:var(--ok);white-space:nowrap}
button:focus-visible{outline:3px solid #fff}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;margin:auto;max-width:420px;background:var(--ok);color:#12210a;padding:8px 12px;display:none;z-index:5;text-align:center;font-size:9px}
.rst{background:none;border:0;color:var(--dim);font:inherit;font-size:8px;margin-top:14px;cursor:pointer}
</style></head><body>
<header>
  <div><h1>GRASS FARM</h1><div class="dim" id="where"></div></div>
  <div class="bal"><span id="bal"></span><small id="sd"></small></div>
</header>
<canvas id="c" width="160" height="120"></canvas>
<div id="hint"></div>
<div id="ctl"><button id="L" aria-label="Влево">◀</button><button id="A">...</button><button id="R" aria-label="Вправо">▶</button></div>
<div id="sheet"></div><div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=id=>document.getElementById(id),f=n=>n.toFixed(3);
const DAY=8000,DAYS=21,KEY='grassfarm2';
const STR={
 green:{n:'Зелёный старт',seed:.02,pr:.04,c:'#7be04e'},
 purple:{n:'Фиолетовый',seed:.06,pr:.09,c:'#b266ff'},
 kush:{n:'Золотой куш',seed:.15,pr:.22,c:'#ffc83d'},
 diamond:{n:'Гидро-алмаз',seed:.4,pr:.6,c:'#5ee7ff'}};
const WHY={purple:'нужен гроубокс',kush:'нужен подвал',diamond:'нужна гидропоника'};
const API='https://evzdmvfdesfyjjbtmjgo.supabase.co/functions/v1/game',APIKEY='';
let S={coin:0,seeds:{},fert:0,pt:[null],rb:[],bb:[],base:false,fans:0,hydro:false,scene:'home',t0:Date.now()},ready=false;
const save=()=>{};
const setS=st=>{const sc=S.scene||'home';S=st;S.scene=sc};
async function api(action,params){
  const h={'Content-Type':'application/json'};
  if(APIKEY){h.apikey=APIKEY;h.Authorization='Bearer '+APIKEY}
  try{
    const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({initData:tg?tg.initData:'',action,params,phrase:params&&params.phrase})});
    const j=await r.json();
    if(!r.ok&&!j.error)j.error='Сервер ответил '+r.status+': '+(j.message||'');
    if(j.state)setS(j.state);
    return j;
  }catch(e){return{error:'Нет связи с сервером'}}
}
const unlocked=k=>k==='green'||(k==='purple'&&S.rb.length>0)||(k==='kush'&&S.base)||(k==='diamond'&&S.hydro);
const prog=p=>Math.min(1,(Date.now()-p.start)/p.dur);
const busy=()=>$('sheet').style.display==='block';

// ---------- drawing ----------
const cv=$('c'),ctx=cv.getContext('2d');
let T=0,cam=0,fade=1,dir=0,face=1,wk=0,near=null;const P={x:70};
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
const line=(cx,cy,a,l,c)=>{for(let i=0;i<=l;i++)R(cx+Math.round(Math.sin(a)*i),cy-Math.round(Math.cos(a)*i),1,1,c)};
function plant(x,yb,q,col,H){
  const h=Math.max(3,Math.round(H*(.12+.88*Math.min(1,q)))),g='#3fbf3a';
  R(x-1,yb-h,2,h,'#2f8f2f');
  const n=q<.3?1:q<.7?2:3,w=2+Math.round(q*3);
  for(let i=0;i<n;i++){const y=yb-Math.round(h*(.25+.25*i));R(x-1-w,y,w,2,g);R(x+1,y,w,2,g)}
  R(x-2,yb-h-1,4,2,g);
  if(q>=1){R(x-2,yb-h-3,4,4,col);R(x-5,yb-Math.round(h*.5),3,3,col);R(x+2,yb-Math.round(h*.5),3,3,col);
    if(Math.floor(T/400)%2)R(x+4,yb-h-4,1,1,'#fff')}
}
function pot(x,p){
  if(p)plant(x,95,prog(p),STR[p.s].c,26);
  R(x-6,95,12,9,'#b5651d');R(x-7,93,14,3,'#d98a3d');R(x-5,93,10,1,'#4a2c17');
}
function box(x,p){
  R(x-9,70,18,34,'#2b2f3a');R(x-8,72,16,30,'#14171e');R(x-8,70,16,2,'#ffe9a8');R(x-8,96,16,6,'#4a2c17');
  if(p){R(x-8,72,16,24,'rgba(255,230,120,.07)');plant(x,96,prog(p),STR[p.s].c,22)}
}
function home(W){
  R(0,0,W,92,'#3a3150');for(let x=0;x<W;x+=16)R(x,0,1,92,'#352c49');
  R(0,92,W,28,'#5a3d2b');R(0,92,W,2,'#2a1d14');for(let x=0;x<W;x+=20)R(x,94,1,26,'#4c3323');
  // poster
  R(48,22,16,22,'#6b4a9a');R(50,24,12,18,'#2c1f45');R(54,28,4,9,'#7be04e');R(52,32,8,2,'#7be04e');
  // window
  const h=new Date().getHours(),day=h>=6&&h<18,eve=h>=18&&h<21;
  R(78,14,32,26,'#d9d2c3');R(80,16,28,22,day?'#7fd0ff':eve?'#ff9a5c':'#0f1538');
  if(day)R(98,19,6,6,'#ffe14d');else if(eve)R(98,28,7,5,'#ffd27a');
  else{R(99,19,5,5,'#f4f1d0');R(84,20,1,1,'#fff');R(90,30,1,1,'#fff');R(103,32,1,1,'#fff');R(86,25,1,1,'#fff')}
  R(80,32,8,6,'#2a2a3a');R(90,29,6,9,'#2a2a3a');R(98,34,10,4,'#2a2a3a');
  if(!day&&!eve){R(82,34,1,1,'#ffe28a');R(92,32,1,1,'#ffe28a')}
  R(93,16,2,22,'#d9d2c3');R(80,26,28,2,'#d9d2c3');
  // clock
  const d=new Date(),mn=d.getMinutes(),hr=d.getHours()%12+mn/60;
  R(128,20,14,14,'#d9d2c3');R(129,21,12,12,'#fff');
  line(135,27,hr/12*6.283,3,'#000');line(135,27,mn/60*6.283,5,'#c0392b');
  // desk + computer
  R(165,76,50,4,'#8a5a33');R(167,80,3,24,'#6b4526');R(210,80,3,24,'#6b4526');
  R(178,56,24,18,'#222');R(180,58,20,14,'#12323d');R(182,61,12,1,'#7be04e');R(182,64,8,1,'#7be04e');
  if(Math.floor(T/500)%2)R(192,64,2,1,'#fff');R(188,74,4,2,'#222');
  R(222,92,12,3,'#a3332a');R(231,80,3,14,'#a3332a');R(226,95,3,9,'#222');
  // door
  R(396,50,20,54,'#2a1d14');R(398,52,16,50,'#3b2a1e');R(400,78,2,2,'#c9a227');
  if(!S.base){R(404,68,6,5,'#c9a227');R(405,64,4,4,'#888')}
  for(let i=S.rb.length;i<6;i++)R(250+24*i-8,102,16,2,'rgba(255,255,255,.12)');
  pot(30,S.pt[0]);S.rb.forEach((p,i)=>box(250+24*i,p));
}
function base(W){
  R(0,0,W,92,'#1e2630');for(let y=6;y<92;y+=8)R(0,y,W,1,'#18202a');
  R(0,92,W,28,'#34343d');R(0,92,W,2,'#1a1a20');
  for(let x=60;x<W;x+=130){R(x,0,1,12,'#111');R(x-2,12,5,4,'#ffe28a');R(x-12,16,25,30,'rgba(255,226,138,.05)')}
  if(S.hydro){R(50,56,W-80,3,'#3b7dd8');for(let i=0;i<S.bb.length;i++){const x=70+23*i;R(x,59,1,10,'#3b7dd8');if(Math.floor(T/300+i)%3===0)R(x,70+((T/60+i*7)%6),1,2,'#8cc4ff')}}
  for(let i=0;i<S.fans;i++){const fx=110+i*100;R(fx-8,24,16,16,'#444');R(fx-6,26,12,12,'#222');
    if(Math.floor(T/90)%2){R(fx-5,31,10,2,'#aaa');R(fx-1,27,2,10,'#aaa')}else{R(fx-4,28,2,2,'#aaa');R(fx+2,28,2,2,'#aaa');R(fx-4,34,2,2,'#aaa');R(fx+2,34,2,2,'#aaa');R(fx-1,31,2,2,'#aaa')}}
  for(let i=0;i<6;i++)R(8+i*5,104-i*6-6,5,6+i*6,'#6b5a4a');
  S.bb.forEach((p,i)=>box(70+23*i,p));
  for(let i=S.bb.length;i<20;i++)R(70+23*i-8,102,16,2,'rgba(255,255,255,.10)');
}
function player(){
  const x=Math.round(P.x),y=104,m=dir&&!busy()?Math.floor(wk)%2:0;
  R(x-3,y-17,6,2,'#3a2a1a');R(x-3,y-15,6,5,'#f0c08a');R(x+(face>0?1:-2),y-13,1,1,'#000');
  R(x-4,y-10,8,6,'#e0563f');R(x-5,y-9,1,4,'#e0563f');R(x+4,y-9,1,4,'#e0563f');
  R(x-3,y-4,2,4-m,'#2b3a67');R(x+1,y-4,2,3+m,'#2b3a67');
}

// ---------- world ----------
const slotL=(L,i,name,x)=>{const p=S[L][i];
  return{x,y:58,k:'slot',L,i,l:!p?'Посадить в '+name:prog(p)>=1?'Собрать урожай':name+': день '+Math.min(DAYS,Math.floor(prog(p)*DAYS)+1)+'/'+DAYS}};
function objs(){
  if(S.scene==='home'){
    const o=[slotL('pt',0,'горшок',30),{x:94,y:6,k:'win',l:'Выглянуть в окно'},{x:135,y:12,k:'clock',l:'Посмотреть на часы'},
      {x:190,y:44,k:'pc',l:'Сесть за компьютер'}];
    S.rb.forEach((_,i)=>o.push(slotL('rb',i,'гроубокс',250+24*i)));
    o.push({x:406,y:38,k:'door',l:S.base?'Спуститься в подвал':'Дверь в подвал (заперта)'});
    return o;
  }
  const o=[{x:24,y:56,k:'door',l:'Подняться в квартиру'}];
  S.bb.forEach((_,i)=>o.push(slotL('bb',i,'гроубокс',70+23*i)));
  return o;
}
function draw(W){
  ctx.clearRect(0,0,160,120);ctx.save();ctx.translate(-Math.round(cam),0);
  S.scene==='home'?home(W):base(W);
  player();
  if(near&&!busy()){const y=near.y+Math.round(Math.sin(T/200)*1.5),x=near.x;R(x-2,y,5,1,'#ffe14d');R(x-1,y+1,3,1,'#ffe14d');R(x,y+2,1,1,'#ffe14d')}
  ctx.restore();
  if(fade>0)R(0,0,160,120,'rgba(0,0,0,'+fade+')');
}
let lastL='';
function frame(ts){
  const dt=Math.min(.05,(ts-(frame.l||ts))/1000);frame.l=ts;T=ts;
  const W=S.scene==='home'?420:550;
  if(!busy()&&dir){P.x+=dir*55*dt;face=dir;wk+=dt*8}
  P.x=Math.max(8,Math.min(W-8,P.x));cam=Math.max(0,Math.min(W-160,P.x-80));
  const os=objs().filter(o=>Math.abs(o.x-P.x)<12).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x));
  near=os[0]||null;
  const l=near?near.l:'Иди вдоль комнаты';
  if(l!==lastL){lastL=l;$('A').textContent=l;$('A').classList.toggle('on',!!near)}
  draw(W);fade=Math.max(0,fade-dt*2.5);
  requestAnimationFrame(frame);
}

// ---------- actions ----------
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function closeSheet(){$('sheet').style.display='none'}
let target=null;
function act(){
  if(busy()||!near)return;const o=near;
  if(o.k==='win'){const h=new Date().getHours();toast(h>=6&&h<18?'Во дворе тихо. Светит солнце.':h<21&&h>=18?'Закат. Соседи расходятся по домам.':'Ночь. Только фонарь у подъезда.')}
  else if(o.k==='clock'){const d=new Date();toast('Сейчас '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'. Идёт день игры '+(Math.floor((Date.now()-S.t0)/DAY)+1))}
  else if(o.k==='pc')shop();
  else if(o.k==='door'){
    if(S.scene==='home'&&!S.base){toast('Заперто. Открой доступ в подвал на компьютере.');return}
    if(S.scene==='home'){S.scene='base';P.x=40}else{S.scene='home';P.x=388}
    fade=1;save();
  }else if(o.k==='slot'){
    const p=S[o.L][o.i];
    if(!p){openPlant(o)}
    else if(prog(p)<1)toast('Куст ещё растёт. День '+Math.min(DAYS,Math.floor(prog(p)*DAYS)+1)+' из '+DAYS)
    else api('harvest',{list:o.L,i:o.i}).then(r=>{if(r.error)toast(r.error);else if(r.gain)toast('Собрано '+r.gain.g+' г. Получено '+f(r.gain.v)+' GRASS')});
  }
}
function openPlant(o){
  target=o;const sh=$('sheet');let h='<h2>Что посадить?</h2>',n=0;
  for(const k in STR){const c=S.seeds[k]||0;if(c>0){n++;h+='<button class="b" data-plant="'+k+'"><span>'+STR[k].n+'<br><span class="dim">'+f(STR[k].pr)+' GRASS за грамм</span></span><em>x'+c+'</em></button>'}}
  if(!n)h+='<div class="dim">Семян нет. Купи их на компьютере.</div>';
  else if(S.fert>0)h+='<div class="dim" style="margin-top:6px">Удобрение в запасе: '+S.fert+'. Потратится само.</div>';
  h+='<button class="b" data-close="1"><span>Отмена</span></button>';
  sh.innerHTML=h;sh.style.display='block';
}
function items(){
  const a=[];
  for(const k in STR){const s=STR[k],u=unlocked(k);
    a.push({id:'seed:'+k,t:'Семя: '+s.n,d:u?'в запасе '+(S.seeds[k]||0)+', '+f(s.pr)+' за г':WHY[k],c:s.seed,ok:u})}
  if(S.rb.length<6)a.push({id:'rbox',t:'Гроубокс в комнату '+S.rb.length+'/6',d:'ещё одно место, урожай +30%',c:.3,ok:true});
  if(!S.base)a.push({id:'base',t:'Доступ в подвал',d:S.rb.length>=6?'внизу до 20 гроубоксов':'сначала 6 гроубоксов в комнате',c:3,ok:S.rb.length>=6});
  else{
    if(S.bb.length<20)a.push({id:'bbox',t:'Гроубокс в подвал '+S.bb.length+'/20',d:'урожай +30%',c:.6,ok:true});
    if(S.fans<5)a.push({id:'fan',t:'Вентилятор '+S.fans+'/5',d:'урожай +6%',c:.3,ok:true});
    if(!S.hydro)a.push({id:'hydro',t:'Гидропоника',d:'быстрее рост, урожай +20%, новый сорт',c:4,ok:true});
    a.push({id:'fert',t:'Удобрение',d:'в запасе '+S.fert+', урожай куста +35%',c:.02,ok:true});
  }
  return a;
}
function shop(){
  const sh=$('sheet'),st=sh.scrollTop;
  let h='<h2>Компьютер</h2><div class="dim">Баланс: '+f(S.coin)+' GRASS</div>';
  items().forEach(a=>{h+='<button class="b" data-buy="'+a.id+'"'+(a.ok&&S.coin>=a.c?'':' disabled')+'><span>'+a.t+'<br><span class="dim">'+a.d+'</span></span><em>'+f(a.c)+'</em></button>'});
  h+='<button class="b" disabled><span>Вывод GRASS на биржу</span><em>скоро</em></button><button class="b" data-close="1"><span>Закрыть</span></button>';
  sh.innerHTML=h;sh.style.display='block';sh.scrollTop=st;
}
function buy(id){
  const a=items().find(x=>x.id===id);if(!a||!a.ok||S.coin<a.c)return;
  api('buy',{id}).then(r=>{if(r.error)toast(r.error);else if(id==='base')toast('Подвал открыт. Дверь справа.');if(busy())shop()});
}
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.close){closeSheet();return}
  if(d.buy){buy(d.buy);return}
  if(d.plant&&target){closeSheet();api('plant',{list:target.L,i:target.i,strain:d.plant}).then(r=>{if(r.error)toast(r.error)})}
});

// ---------- hint + hud ----------
function hint(){
  const all=[...S.pt,...S.rb,...S.bb].filter(Boolean),seeds=Object.values(S.seeds).reduce((a,b)=>a+b,0);
  if(all.some(p=>prog(p)>=1))return 'Куст созрел! Подойди к нему и собери урожай.';
  if(!all.length&&seeds)return 'У тебя есть горшок и одно семя. Подойди к горшку слева и посади его.';
  if(!all.length)return 'Семян нет. Подойди к компьютеру и купи семя.';
  if(S.rb.length<6&&S.coin>=.3)return 'Хватает на гроубокс. Купи его за компьютером.';
  if(S.rb.length>=6&&!S.base&&S.coin>=3)return 'Можно открыть подвал. Купи доступ на компьютере.';
  if(seeds&&S.rb.length)return 'У тебя есть семена. Посади их в свободный гроубокс.';
  return 'Куст растёт. Осмотрись: окно, часы, компьютер. Зарабатывай GRASS и расширяйся.';
}
function hud(){
  $('bal').textContent=f(S.coin)+' GRASS';
  $('sd').textContent='семян: '+Object.values(S.seeds).reduce((a,b)=>a+b,0);
  $('where').textContent=S.scene==='home'?'Квартира':'Подвал';
  $('hint').textContent=hint();
}
setInterval(()=>{hud();save()},1000);

// ---------- input ----------
const hold=(id,v)=>{const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();dir=v});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(dir===v)dir=0}));
  b.addEventListener('contextmenu',e=>e.preventDefault())};
hold('L',-1);hold('R',1);
$('A').addEventListener('click',act);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')dir=-1;
  else if(e.key==='ArrowRight'||e.key==='d')dir=1;
  else if(e.key==='e'||e.key===' ')act();
});
addEventListener('keyup',e=>{if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))dir=0});

const sheetHTML=h=>{const sh=$('sheet');sh.innerHTML=h;sh.style.display='block'};
function showIntro(){sheetHTML('<h2>Тебе 18</h2><div>Ты живёшь один и решил вырастить свой первый куст. Дома есть горшок слева, одно семя и немного GRASS.<br><br>Ходи кнопками ◀ ▶. Когда рядом что-то есть, нажми большую кнопку по центру.<br><br>Продавай урожай, покупай гроубоксы, открой подвал и стань крупным фермером.</div><button class="b" data-close="1"><span>Начать</span></button>')}
function loginScreen(msg){sheetHTML('<h2>Вход</h2><div>'+(msg||'Аккаунта на этом Telegram пока нет. Создай новый или восстанови старый по фразе из 12 слов.')+'</div><button class="b" data-login="new"><span>Создать аккаунт</span></button><button class="b" data-login="rec"><span>Восстановить по фразе</span></button>')}
function showPhrase(p){sheetHTML('<h2>Секретная фраза</h2><div>Запиши эти 12 слов и храни в тайне. Они нужны, чтобы вернуть аккаунт. Показываются один раз. Никому их не говори.</div><div style="margin:10px 0;line-height:2;color:#7be04e;column-count:2;user-select:text;-webkit-user-select:text">'+p.split(' ').map((w,i)=>(i+1)+'. '+w).join('<br>')+'</div><button class="b" data-login="copy" data-p="'+p+'"><span>Скопировать</span></button><button class="b" data-login="saved"><span>Я записал, продолжить</span></button>')}
$('sheet').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const l=b.dataset.login;if(!l)return;
  if(l==='new'){b.disabled=true;const r=await api('create');if(r.error){loginScreen(r.error);return}ready=true;showPhrase(r.phrase)}
  else if(l==='rec')sheetHTML('<h2>Восстановление</h2><div>Введи 12 слов через пробел.</div><textarea id="ph" rows="3" style="width:100%;margin-top:8px;font:inherit;font-size:10px;background:#140e1c;color:#f1e9ff;border:3px solid #43335a;padding:6px;user-select:text;-webkit-user-select:text"></textarea><button class="b" data-login="go"><span>Войти</span></button><button class="b" data-login="back"><span>Назад</span></button>');
  else if(l==='back')loginScreen();
  else if(l==='go'){const r=await api('recover',{phrase:$('ph').value});if(r.error){loginScreen(r.error);return}ready=true;closeSheet();toast('С возвращением!')}
  else if(l==='copy'){try{await navigator.clipboard.writeText(b.dataset.p);toast('Фраза скопирована')}catch(_){toast('Не вышло скопировать, запиши вручную')}}
  else if(l==='saved'){closeSheet();showIntro()}
  else if(l==='retry')location.reload();
});
async function boot(){
  hud();requestAnimationFrame(frame);
  sheetHTML('<h2>Загрузка</h2><div class="dim">Подключаемся...</div>');
  const r=await api('load');
  if(r.error){sheetHTML('<h2>Ошибка</h2><div>'+r.error+'</div><button class="b" data-login="retry"><span>Повторить</span></button>');return}
  if(r.state){ready=true;closeSheet()}else loginScreen();
}
boot();
</script></body></html>
